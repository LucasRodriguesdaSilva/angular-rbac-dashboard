<mat-card>
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <mat-card-header>
    <mat-card-title>Security Admin</mat-card-title>
    <mat-card-subtitle>Acesse o painel de controle defensivo</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-mail Corporativo</mat-label>
        <input matInput type="email" formControlName="email" placeholder="ex: seuNome@vitru.com">
        @if(loginForm.get('email')?.hasError('email')) {
          <mat-error>Insira um endereço válido</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Chave de Acesso</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>

      @if(errorMessage) {
        <div class="error-banner">
          {{ errorMessage }}
        </div>
      }

      <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading" class="full-width btn-submit">
        Autenticar no Sistema
      </button>
    </form>
  </mat-card-content>
</mat-card>
