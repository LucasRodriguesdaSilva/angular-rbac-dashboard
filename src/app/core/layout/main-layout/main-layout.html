<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary">Menu Admin</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">
        <mat-icon matListIcon>dashboard</mat-icon> Dashboard
      </a>
      <a mat-list-item routerLink="/users">
        <mat-icon matListIcon>people</mat-icon> Usuários
      </a>
      <a mat-list-item routerLink="/audit-logs">
        <mat-icon matListIcon>history_toggle_off</mat-icon> Logs de Auditoria
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar color="white" class="topbar">
      <span>Painel Administrativo</span>
      <span class="spacer"></span>
      <span class="user-badge">{{ userRole }}</span>
      <button mat-icon-button aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="page-container">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
