<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="sidebar-brand">
      <mat-icon class="brand-icon">shield</mat-icon>
      <span>SecDevOps</span>
    </div>

    <mat-nav-list class="nav-menu">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <div matListItemTitle class="text-secondary">Dashboard</div>
      </a>

      <a *appHasPermission="'users.read'" mat-list-item routerLink="/users" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <div matListItemTitle>Usuários</div>
      </a>

      <a *appHasPermission="'logs.read'" mat-list-item routerLink="/audit-logs" routerLinkActive="active-link">
        <mat-icon matListItemIcon>history_toggle_off</mat-icon>
        <div matListItemTitle>Logs de Auditoria</div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content-area">
    <mat-toolbar class="topbar">
      <span class="page-context">Painel Administrativo</span>
      <span class="spacer"></span>

      <div class="user-session">
        <span class="role-indicator" [ngClass]="userRole().toLowerCase()">
          {{ userRole() }}
        </span>

        <button mat-button [matMenuTriggerFor]="userMenu" class="avatar-trigger">
          <div class="user-avatar">
            {{ userName().charAt(0) | uppercase }}
          </div>
          <mat-icon class="arrow-icon">arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" class="custom-user-menu" xPosition="before">
          <div class="menu-profile-header">
            <p class="profile-name">{{ userName() }}</p>
            <p class="profile-email">{{ userEmail() }}</p>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onLogout()" class="btn-logout">
            <mat-icon class="text-danger">logout</mat-icon>
            <span>Encerrar Sessão</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <main class="page-wrapper">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
