# .github/workflows/ci.yml
name: Angular CI (TDD Validation with Vitest)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter Validation
        run: npx ng lint

      - name: Angular Build Validation
        run: npx ng build --configuration=production

      # ALTERAÇÃO AQUI: Comando nativo do Vitest para rodar e finalizar imediatamente na esteira
      - name: Run Unit Tests (Vitest TDD Check)
        run: npx vitest run
